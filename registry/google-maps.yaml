# Reversibility Classes — Google Maps (archived MCP reference server)
# Tool names verified against the evidence URLs below. Classes are drafts until reviewed.
spec_version: '0.1'
server:
  id: google-maps
  name: Google Maps (archived MCP reference server)
  source: https://github.com/modelcontextprotocol/servers-archived/tree/main/src/google-maps
  evidence:
  - https://raw.githubusercontent.com/modelcontextprotocol/servers-archived/main/src/google-maps/README.md
  - https://raw.githubusercontent.com/modelcontextprotocol/servers-archived/main/src/google-maps/index.ts
  status: archived
  notes: Archived (assumed from the servers-archived repository; not confirmed via the GitHub API). Every
