- name: maps_reverse_geocode
  class: R0
  rationale: Looks up an address for coordinates.
  review: draft
- name: maps_search_places
  class: R0
  rationale: Searches for places.
  review: draft
- name: maps_place_details
  class: R0
  rationale: Reads details for a place.
  review: draft
- name: maps_distance_matrix
  class: R0
  rationale: Computes distances and travel times.
  review: draft
- name: maps_elevation
  class: R0
  rationale: Looks up elevations.
  review: draft
- name: maps_directions
  class: R0
  rationale: Computes route directions.
  review: draft
