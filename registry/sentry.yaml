  review: draft
- name: search_traces
  class: R0
  rationale: Searches spans and traces.
  review: draft
- name: unlink_issue
  class: R2
  rationale: link_issue can add the reference back, but re-linking records new link activity and, for
    Sentry App links, calls the App's link callback again, so the prior state is not restored exactly.
  compensation: link_issue
  review: draft
- name: update_alert_rule
  class: R4
  rationale: Changed triggers or actions send notifications that cannot be recalled; the previous settings
    are readable but notifications sent meanwhile are not.
  disclosure: true
  when:
  - arg: status
    equals: disabled
    class: R2
    rationale: Disabling stops notifications; the previous settings were readable and can be set again.
  compensation: update_alert_rule with the previous status and settings read with get_alert_rule
  review: draft
- name: update_dsn
  class: R3
  rationale: Deactivating or rate-limiting a client key drops events from every client that uses it, and
    events dropped meanwhile cannot be recovered.
  review: draft
- name: update_issue
  class: R4
  rationale: When reason is given, the tool posts it as a comment on the issue's activity feed.
  disclosure: true
  when:
  - arg: reason
    absent: true
    class: R2
    rationale: Status and assignment can be set back with update_issue, though assignment and resolution
      notifications are already sent.
  compensation: update_issue with the previous status and assignee, without reason
  review: draft
- name: update_metric_monitor
  class: R2
  rationale: Overwrites a monitor's settings; the previous settings are readable with get_metric_monitor_details
    and can be set again.
  compensation: update_metric_monitor with the previous settings
  review: draft
- name: update_project
  class: R2
  rationale: Overwrites the name, slug or platform; the previous values are readable and can be set again,
    but URLs and integrations using the old slug break meanwhile.
  compensation: update_project with the previous values
  review: draft
- name: update_uptime_monitor
  class: R4
  rationale: Can change the check to send repeated requests with any method, headers and body to any URL,
    which can change state on or transmit data to the target.
  when:
  - all:
    - arg: method
      in:
      - GET
      - HEAD
      - OPTIONS
    - arg: headers
      absent: true
    - arg: body
      absent: true
    class: R2
    rationale: A read-only HTTP method with headers and body untouched, because get_uptime_monitor_details
      redacts sensitive headers and omits the body, so their previous values cannot be read back to restore.
  compensation: update_uptime_monitor with the previous settings
  review: draft
- name: whoami
  class: R0
  rationale: Reads the authenticated identity.
  review: draft
