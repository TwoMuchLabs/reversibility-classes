  review: draft
- name: search_issue_events
  class: R0
  rationale: Searches an issue's events.
  review: draft
- name: search_issues
  class: R0
  rationale: Searches issues.
  review: draft
- name: search_logs
  class: R0
  rationale: Searches logs.
  review: draft
- name: search_metrics
  class: R0
  rationale: Searches metrics.
  review: draft
- name: search_profiles
  class: R0
