- name: link_issue
  class: R3
  rationale: For Sentry App links (Linear, Shortcut and other Apps) Sentry calls the App's link callback
    in the external service, which unlink_issue does not reverse because it removes only the Sentry association.
  when:
  - all:
    - arg: appSlug
      absent: true
    - arg: externalIssueUrl
      matches: '^https://(github\.com|gitlab\.com|bitbucket\.org|dev\.azure\.com|[a-z0-9-]+\.atlassian\.net)/'
    class: R2
    rationale: A native-integration link with no provider comment; unlink_issue removes the association,
      but the link activity entry stays on the issue.
  compensation: unlink_issue
  review: draft
- name: onboarding_status_update
  class: R2
  rationale: A later update cannot replace a completed, skipped or bypassed stage or a completed or failed
    run (Sentry freezes them and bypasses earlier stages), so the only recovery is a new onboarding run.
  compensation: start a new onboarding run from Sentry's getting-started flow; the old run stays frozen
    until it expires
  review: draft
- name: remove_team_from_project
  class: R3
  rationale: Revokes a team's access to a project, which changes access rights.
  review: draft
- name: search_agent_conversations
  class: R0
  rationale: Searches conversations.
  review: draft
- name: search_ai_conversations
  class: R0
  rationale: Deprecated alias of search_agent_conversations; searches conversations.
  review: draft
- name: search_docs
  class: R0
