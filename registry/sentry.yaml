# Reversibility Classes — Sentry (official MCP server)
# Tool names verified against the evidence URLs below. Classes are drafts until reviewed.
spec_version: '0.1'
server:
  id: sentry
  name: Sentry (official MCP server)
  source: https://github.com/getsentry/sentry-mcp
  evidence:
  - https://github.com/getsentry/sentry-mcp/blob/main/packages/mcp-core/src/toolDefinitions.json
  - https://raw.githubusercontent.com/getsentry/sentry-mcp/main/README.md
  - https://github.com/getsentry/sentry-mcp/tree/main/packages/mcp-core/src/tools/catalog
  - https://github.com/getsentry/sentry-mcp/blob/main/packages/mcp-core/src/tools/surfaces.ts
  version: getsentry/sentry-mcp@e4c8c562
  status: active
  notes: Only 15 tools are listed directly; the rest are catalog tools reached through search_sentry_tools
    and execute_sentry_tool, so a gateway that only sees execute_sentry_tool must classify by its name
    argument. Skills (--skills / ?skills=) gate which tools exist; there is no read-only flag, the closest
    is enabling only the inspect and docs skills. AI-powered search tools send the query to the configured
    LLM provider.
tools:
- name: add_issue_note
  class: R4
  rationale: Posts a human-visible comment to the issue's activity feed, which subscribers see and are
    notified of.
  disclosure: true
  review: draft
- name: add_team_to_project
  class: R3
  rationale: Grants a team access to a project, which changes access rights.
  review: draft
- name: analyze_issue_with_seer
  class: R2
  rationale: Starts a Seer analysis run on the issue; the run is recorded on the issue and consumes Seer
    usage that cannot be returned, but no issue data changes.
  compensation: none needed beyond ignoring the analysis; the run record, its issue activity entry,
    the Seer quota used and any Seer webhooks sent to installed Sentry Apps remain
  review: draft
- name: create_alert_rule
  class: R4
  rationale: New alerts default to active and exist to send notifications to people and integrations,
    which cannot be recalled.
  disclosure: true
  when:
  - arg: status
    equals: disabled
    class: R1
    rationale: A disabled alert sends nothing and can be deleted.
  compensation: delete_alert_rule
  review: draft
- name: create_dsn
  class: R3
  rationale: Issues a new client key, a credential that lets anyone holding it send events into an existing
    project until it is deactivated.
  review: draft
- name: create_metric_monitor
  class: R2
  rationale: A new monitor can be deleted, but issues and notifications it triggers before then cannot
    be recalled.
  compensation: delete_metric_monitor
  review: draft
- name: create_project
  class: R1
  rationale: A new project can be deleted in Sentry's project settings; nothing existing is changed.
  compensation: delete the project in Sentry settings
  review: draft
- name: create_team
  class: R1
  rationale: A new team can be deleted in Sentry's team settings; nothing existing is changed.
  compensation: delete the team in Sentry settings
  review: draft
- name: create_uptime_monitor
  class: R4
  rationale: Configures Sentry to send repeated HTTP requests with any method, headers and body to any
    URL, which can change state on or transmit data to the target.
  when:
  - all:
    - arg: method
      absent: true
    - arg: headers
      absent: true
    - arg: body
      absent: true
    class: R2
    rationale: The check uses the default GET with no custom headers or body; the monitor can be deleted,
      but active monitors consume paid uptime quota.
  - all:
    - arg: method
      in:
      - GET
      - HEAD
      - OPTIONS
    - arg: headers
      absent: true
    - arg: body
      absent: true
    class: R2
    rationale: A read-only HTTP method with no custom headers or body; the monitor can be deleted, but
      active monitors consume paid uptime quota.
  compensation: delete_uptime_monitor
  review: draft
- name: delete_alert_rule
  class: R4
  rationale: Permanently deletes the Alert; the server has no restore and the rule must be rebuilt by
    hand.
  review: draft
- name: delete_metric_monitor
  class: R4
  rationale: Permanently deletes the monitor and, when present, its legacy metric alert and incident history.
  review: draft
- name: delete_monitor_environment
  class: R4
  rationale: The tool description states the deletion is irreversible; the environment's check-in history
    is removed.
  review: draft
- name: delete_uptime_monitor
  class: R4
  rationale: The tool description states deletion cannot be undone; the monitor's check history is removed.
  review: draft
- name: execute_sentry_tool
  class: R4
  rationale: Runs any catalog tool, including permanent deletes and comment posting, with arbitrary arguments.
  when:
  - arg: name
    in:
    - find_alert_rules
    - find_dashboards
    - find_dsns
    - find_metric_monitors
    - find_monitors
    - find_releases
    - find_teams
    - find_uptime_monitors
    - get_agent_conversation_details
    - get_ai_conversation_details
    - get_alert_options
    - get_alert_rule
    - get_dashboard_details
    - get_doc
    - get_event_attachment
    - get_event_stacktrace
    - get_issue_activity
    - get_issue_breadcrumbs
    - get_issue_details
    - get_issue_tag_values
    - get_issue_user_reports
    - get_latest_base_snapshot
    - get_metric_monitor_details
    - get_monitor_details
    - get_profile
    - get_profile_details
    - get_release_details
    - get_replay_details
    - get_sentry_mcp_info
    - get_snapshot
    - get_snapshot_image
    - get_span_details
    - get_trace_details
    - get_uptime_monitor_details
    - search_agent_conversations
    - search_ai_conversations
    - search_docs
    - search_events
    - search_issue_events
    - whoami
    class: R0
    rationale: Runs a read-only catalog tool.
  - arg: name
    in:
    - create_project
    - create_team
    class: R1
    rationale: Runs a catalog tool classed R1 in this record.
  - all:
    - arg: name
      equals: link_issue
    - arg: arguments.appSlug
      absent: true
    - arg: arguments.externalIssueUrl
      matches: '^https://(github\.com|gitlab\.com|bitbucket\.org|dev\.azure\.com|[a-z0-9-]+\.atlassian\.net)/'
    class: R2
    rationale: Links a native-integration ticket; unlink_issue removes the association but not the link
      activity entry.
  - all:
    - arg: name
      equals: create_alert_rule
    - arg: arguments.status
      equals: disabled
    class: R2
    rationale: Creates a disabled Alert, which sends nothing and can be deleted.
  - arg: name
    in:
    - create_metric_monitor
    - onboarding_status_update
    - unlink_issue
    - update_metric_monitor
    - update_project
    class: R2
    rationale: Runs a catalog tool classed R2 in this record.
  - all:
    - arg: name
      equals: update_alert_rule
    - arg: arguments.status
      equals: disabled
    class: R2
    rationale: Disables an Alert; the previous settings were readable and can be set again.
  - arg: name
    in:
    - add_team_to_project
    - create_dsn
    - link_issue
    - remove_team_from_project
    - update_dsn
    class: R3
    rationale: Runs a catalog tool classed R3 in this record.
  compensation: the compensation recorded for the catalog tool named in the name argument
  review: draft
