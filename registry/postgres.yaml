# Reversibility Classes — PostgreSQL (archived MCP reference server)
# Tool names verified against the evidence URLs below. Classes are drafts until reviewed.
spec_version: '0.1'
server:
  id: postgres
  name: PostgreSQL (archived MCP reference server)
  source: https://github.com/modelcontextprotocol/servers-archived/tree/main/src/postgres
  evidence:
  - https://raw.githubusercontent.com/modelcontextprotocol/servers-archived/main/src/postgres/README.md
  - https://raw.githubusercontent.com/modelcontextprotocol/servers-archived/main/src/postgres/index.ts
  version: modelcontextprotocol/servers-archived@9be4674d
  status: archived
  notes: Archived. The server runs every query inside a READ ONLY transaction and always rolls it back.
tools:
- name: query
  class: R4
  rationale: The SQL is run inside a read-only transaction, but the driver accepts several statements,
    so a query beginning with COMMIT; escapes it and can change or destroy data.
  when:
  - arg: sql
    matches: '^\s*SELECT\b[^;]*;?\s*$'
    class: R0
    rationale: A single SELECT statement, run inside the server's read-only transaction.
  review: draft
