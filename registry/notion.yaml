# Reversibility Classes — Notion (official self-hosted MCP server)
# Tool names verified against the evidence URLs below. Classes are drafts until reviewed.
spec_version: '0.2'
server:
  id: notion
  name: Notion (official self-hosted MCP server)
  source: https://github.com/makenotion/notion-mcp-server
  evidence:
  - https://raw.githubusercontent.com/makenotion/notion-mcp-server/main/README.md
  - https://github.com/makenotion/notion-mcp-server/blob/main/scripts/notion-openapi.json
  - https://github.com/makenotion/notion-mcp-server/blob/main/src/openapi-mcp-server/mcp/proxy.ts
  - https://github.com/makenotion/notion-mcp-server/blob/main/src/openapi-mcp-server/openapi/parser.ts
  version: makenotion/notion-mcp-server@730ae781
  status: active
  notes: Tools are generated from scripts/notion-openapi.json as "API-" plus the operationId. The server
    marks every non-GET tool destructiveHint:true, including API-post-search and API-query-data-source,
    which only read. There is no read-only flag, but an integration token limited to the "Read content"
    capability blocks writes. Archived and trashed pages and blocks can be restored. The API keeps no
    prior version when content is overwritten; deployments on plans with page history can override the
    overwrite tools to R3. Content written under a page that is shared to the web becomes public. The
    vendor says this server is no longer actively maintained; the hosted Remote Notion MCP has a different
    tool set and is not covered.
  packages:
  - '@notionhq/notion-mcp-server'
tools:
- name: API-get-user
  class: R0
  rationale: Reads a user.
  review: draft
- name: API-get-users
  class: R0
  rationale: Lists users.
  review: draft
- name: API-get-self
  class: R0
  rationale: Reads the integration's bot user.
  review: draft
- name: API-post-search
  class: R0
  rationale: Searches pages and data sources by title; the POST method only carries the query.
  review: draft
- name: API-get-block-children
  class: R0
  rationale: Lists child blocks.
  review: draft
- name: API-patch-block-children
  class: R4
  rationale: Content created under a page shared to the web is published at once; a deployment whose workspace
    has no public pages can override this.
  disclosure: true
  review: draft
- name: API-retrieve-a-block
  class: R0
  rationale: Reads a block.
  review: draft
- name: API-update-a-block
  class: R4
  rationale: Overwrites block content and keeps no prior version; the proxy forwards arguments unchecked,
    so no argument pattern safely limits it to archiving.
  review: draft
- name: API-delete-a-block
  class: R1
  rationale: Moves the block to trash, from which Notion can restore it.
  compensation: API-update-a-block with archived false, or for a page block API-patch-page with in_trash
    false
  review: draft
- name: API-retrieve-a-page
  class: R0
  rationale: Reads page properties.
  review: draft
- name: API-patch-page
  class: R4
  rationale: Overwrites page properties, including title and text content, and keeps no prior version;
    the proxy forwards arguments unchecked.
  compensation: API-patch-page with the previous values, or with in_trash false
  review: draft
- name: API-post-page
  class: R4
  rationale: Content created under a page shared to the web is published at once; a deployment whose workspace
    has no public pages can override this.
  disclosure: true
  review: draft
- name: API-retrieve-a-page-property
  class: R0
  rationale: Reads a page property.
  review: draft
- name: API-retrieve-a-comment
  class: R0
  rationale: Lists comments.
  review: draft
- name: API-create-a-comment
  class: R4
  rationale: Posts a comment that other people with access see and are notified of.
  disclosure: true
  review: draft
- name: API-query-data-source
  class: R0
  rationale: Queries rows of a data source; the POST method only carries the filter.
  review: draft
- name: API-retrieve-a-data-source
  class: R0
  rationale: Reads a data source schema.
  review: draft
- name: API-update-a-data-source
  class: R4
  rationale: A property schema change can remove a property or change its type, which discards that property's
    values on every row.
  when:
  - all:
    - arg: properties
      absent: true
    - arg: parent
      absent: true
    class: R2
    rationale: Only the title, description, icon or trash state changes, and the previous values were readable
      and can be set again; a parent, which the proxy forwards unchecked, would move the data source into
      another database's permissions.
  compensation: API-update-a-data-source with the previous title, description and icon, or with in_trash
    false
  review: draft
- name: API-create-a-data-source
  class: R4
  rationale: Content created under a page shared to the web is published at once; a deployment whose workspace
    has no public pages can override this.
  disclosure: true
  review: draft
- name: API-list-data-source-templates
  class: R0
  rationale: Lists templates.
  review: draft
- name: API-retrieve-a-database
  class: R0
  rationale: Reads database metadata.
  review: draft
- name: API-move-page
  class: R3
  rationale: A moved page inherits the permissions of its new parent, which changes who can access it.
  compensation: API-move-page back to the previous parent
  review: draft
- name: API-retrieve-page-markdown
  class: R0
  rationale: Reads page content.
  review: draft
- name: API-update-page-markdown
  class: R4
  rationale: Can replace the page or delete child pages with no copy kept, and any content it writes, including
    insert_content, is published at once under a page shared to the web.
  disclosure: true
  review: draft
