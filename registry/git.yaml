# Reversibility Classes — Git (MCP reference server)
# Tool names verified against the evidence URLs below. Classes are drafts until reviewed.
spec_version: '0.2'
server:
  id: git
  name: Git (MCP reference server)
  source: https://github.com/modelcontextprotocol/servers/tree/main/src/git
  evidence:
  - https://raw.githubusercontent.com/modelcontextprotocol/servers/main/src/git/README.md
  - https://raw.githubusercontent.com/modelcontextprotocol/servers/main/src/git/src/mcp_server_git/server.py
  version: modelcontextprotocol/servers@51b6382a
  status: active
  notes: The server has no push, fetch or remote tools, so every effect stays in the local repository.
tools:
- name: git_status
  class: R0
  rationale: Reads repository state.
  review: draft
- name: git_diff_unstaged
  class: R0
  rationale: Reads repository state.
  review: draft
- name: git_diff_staged
  class: R0
  rationale: Reads repository state.
  review: draft
- name: git_diff
  class: R0
  rationale: Reads repository state.
  review: draft
- name: git_commit
  class: R1
  rationale: A local commit that has not been pushed can be undone with a soft reset, which restores HEAD
    and leaves the committed changes staged as they were.
  compensation: git reset --soft HEAD~1 (git update-ref -d HEAD for a first commit); a plain or mixed reset
    would also unstage the changes
  review: draft
- name: git_add
  class: R3
  rationale: Staging replaces any previously staged version of the paths, which survives only as a dangling
    blob until git gc prunes it, and git_reset is no undo because it unstages the whole index, not just
    these paths.
  review: draft
- name: git_reset
  class: R3
  rationale: Resetting the whole index discards staged versions that differ from the working tree, which
    git_add cannot bring back because it stages the working-tree version; they survive only as dangling
    blobs until git gc prunes them.
  review: draft
- name: git_log
  class: R0
  rationale: Reads history.
  review: draft
- name: git_create_branch
  class: R1
  rationale: A new local branch can be deleted.
  compensation: delete the branch
  review: draft
- name: git_checkout
  class: R4
  rationale: git checkout silently overwrites ignored untracked files that the target branch tracks (the
    documented --overwrite-ignore default), and checking out the previous branch then deletes them, so
    their content is lost with no copy in git.
  compensation: git_checkout the previous branch (does not restore overwritten ignored files)
  review: draft
- name: git_show
  class: R0
  rationale: Reads a commit or file.
  review: draft
- name: git_branch
  class: R0
  rationale: Lists branches.
  review: draft
