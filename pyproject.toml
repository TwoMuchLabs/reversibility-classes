[build-system]
requires = ["hatchling>=1.24", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "rclass"
version = "0.8.0"
description = "Reversibility Classes (R0-R4) for AI agent tool calls: spec, open registry and reference classifier"
dynamic = ["readme"]
requires-python = ">=3.10"
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-SPEC-AND-DATA.md"]
authors = [{ name = "Deepak Waghmare" }]
keywords = ["ai-agents", "mcp", "model-context-protocol", "ai-governance", "agent-security", "guardrails", "eu-ai-act"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = ["pyyaml>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
rclass = "rclass.cli:main"

[project.urls]
Homepage = "https://github.com/TwoMuchLabs/reversibility-classes"
Specification = "https://github.com/TwoMuchLabs/reversibility-classes/blob/main/SPEC.md"
Changelog = "https://github.com/TwoMuchLabs/reversibility-classes/blob/main/CHANGELOG.md"
Issues = "https://github.com/TwoMuchLabs/reversibility-classes/issues"

# The README is also the PyPI project page, where relative links do not resolve.
# Point them at this version's tag on GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)]+)\)'
replacement = '](https://github.com/TwoMuchLabs/reversibility-classes/blob/v$HFPR_VERSION/\1)'

[tool.hatch.build.targets.wheel]
packages = ["rclass"]

[tool.hatch.build.targets.wheel.force-include]
"schema/rclass.schema.json" = "rclass/rclass.schema.json"
"registry" = "rclass/registry"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Correctness (pyflakes, syntax/runtime errors) and bugbear; style is not enforced.
select = ["E4", "E7", "E9", "F", "B"]
