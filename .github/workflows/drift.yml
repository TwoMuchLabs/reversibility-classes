name: Registry drift

# Weekly: start the latest release of each registry server and report tools the registry
# does not classify yet. Opens (or updates) one issue labelled `drift` when there is work to do.

on:
  schedule:
    - cron: "17 22 * * 0"   # Monday 06:17 Singapore time
  workflow_dispatch:
  push:                     # and whenever a record or the check itself changes
    branches: [main]
    paths:
      - "registry/**"
      - "scripts/check_drift.py"
      - "scripts/drift_targets.json"
      - ".github/workflows/drift.yml"

permissions:
  contents: read

jobs:
  # Runs third-party server releases, so it holds no write token, and checkout leaves no credentials on disk.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      drift: ${{ steps.check.outputs.drift }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: pip install -e .
      - name: Check every target server
        id: check
        run: |
          set +e
          python scripts/check_drift.py drift-report.md
          echo "drift=$?" >> "$GITHUB_OUTPUT"
          [ -f drift-report.md ] && cat drift-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.check.outputs.drift == '1'
        with:
          name: drift-report
          path: drift-report.md

  # Only this job can write issues, and it runs no third-party code.
  report:
    needs: check
    if: needs.check.outputs.drift == '1'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: drift-report
      - name: Open or update the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create drift --color FBCA04 --description "Registry no longer matches a server's latest release" 2>/dev/null || true
          existing=$(gh issue list --label drift --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file drift-report.md
          else
            gh issue create --title "Registry drift: new tools to classify, or servers that could not be checked" --label drift --body-file drift-report.md
          fi
