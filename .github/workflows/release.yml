name: Release

# On every push to main: publish any release CHANGELOG.md describes that has no tag yet
# (see scripts/release.py). To cut a release, bump pyproject.toml and date its CHANGELOG section.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" && pytest -q
      - name: Publish missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py
