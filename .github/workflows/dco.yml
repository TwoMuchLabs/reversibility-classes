name: DCO

# Every commit in a pull request must carry a Signed-off-by line for its author
# (Developer Certificate of Origin, see CONTRIBUTING.md).

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_dco.py "$BASE" "$HEAD"
